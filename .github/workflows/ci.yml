name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.2 pytest pydantic click
          pip install -e .

      - name: F821 Undefined Name Lint Check
        run: |
          ruff check --select F821 offtest/ tests/

      - name: Run Test Suite
        run: |
          python -m pytest -v

  hardened-container-verification:
    name: Hardened Container Air-Gap Verification (--network none)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build offtest test image
        run: |
          docker build -t offtest:test .

      - name: Assert Air-Gap Container Security Boundaries
        run: |
          mkdir -p /tmp/test_out
          chmod 777 /tmp/test_out
          # Execute assessment inside hardened container with zero network and read-only repo
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 10001:10001 \
            -v $GITHUB_WORKSPACE/sample_repos/sample_web_app:/repo:ro \
            -v /tmp/test_out:/out:rw \
            offtest:test assess /repo --out /out
