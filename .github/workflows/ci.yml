name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint (F821) & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic click
          pip install -e .

      - name: F821 Undefined Name Lint Check
        run: |
          ruff check --select F821 offtest/ tests/

      - name: Run Test Suite
        run: |
          pytest -v
