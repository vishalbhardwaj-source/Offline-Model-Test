    <text x="875" y="54" fill="#faf5ff" font-size="13" font-weight="bold" text-anchor="middle">Flakiness Quarantine</text>
    <text x="875" y="72" fill="#e9d5ff" font-size="11" text-anchor="middle">Repeat-Sampling (N >= 3)</text>

    <!-- CI Gate Summary Text -->
