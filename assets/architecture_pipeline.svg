    <text x="850" y="156" fill="#94a3b8" font-size="11" text-anchor="middle">PyPI, NPM, Cargo, Poetry</text>

    <line x1="730" y1="142" x2="590" y2="142" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

