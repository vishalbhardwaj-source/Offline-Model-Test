    <text x="135" y="130" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle">1. REPORT_1_DETAILED.md</text>
    <text x="135" y="152" fill="#e4e4e7" font-size="11" text-anchor="middle">Exhaustive Audit Dossier</text>
    <text x="135" y="172" fill="#a1a1aa" font-size="10" text-anchor="middle">• 100% File Dispositions</text>
    <text x="135" y="188" fill="#a1a1aa" font-size="10" text-anchor="middle">• CycloneDX 1.5 SBOM</text>
    <text x="135" y="204" fill="#a1a1aa" font-size="10" text-anchor="middle">• 7-Dimension Coverage</text>

    <rect x="275" y="105" width="210" height="110" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <text x="380" y="130" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">2. REPORT_2_ISSUES.md</text>
    <text x="380" y="152" fill="#e4e4e7" font-size="11" text-anchor="middle">Actionable Punch-List</text>
    <text x="380" y="172" fill="#a1a1aa" font-size="10" text-anchor="middle">• Exposure Priority Score</text>
    <text x="380" y="188" fill="#a1a1aa" font-size="10" text-anchor="middle">• Stable Fingerprint IDs</text>
    <text x="380" y="204" fill="#a1a1aa" font-size="10" text-anchor="middle">• CWE / CVSS Estimates</text>

    <rect x="515" y="105" width="210" height="110" rx="6" fill="#18181b" stroke="#eab308" stroke-width="1.5"/>
    <text x="620" y="130" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle">3. REPORT_3_WORKFLOWS.md</text>
    <text x="620" y="152" fill="#e4e4e7" font-size="11" text-anchor="middle">Execution Journeys</text>
    <text x="620" y="172" fill="#a1a1aa" font-size="10" text-anchor="middle">• UI &amp; Ingestion Triggers</text>
    <text x="620" y="188" fill="#a1a1aa" font-size="10" text-anchor="middle">• Step-by-Step Pipelines</text>
    <text x="620" y="204" fill="#a1a1aa" font-size="10" text-anchor="middle">• Linked Test Anchors</text>

    <rect x="760" y="105" width="210" height="110" rx="6" fill="#18181b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="865" y="130" fill="#f472b6" font-size="13" font-weight="bold" text-anchor="middle">4. results.sarif</text>
    <text x="865" y="152" fill="#e4e4e7" font-size="11" text-anchor="middle">OASIS SARIF 2.1.0 Standard</text>
    <text x="865" y="172" fill="#a1a1aa" font-size="10" text-anchor="middle">• Taint codeFlows Traces</text>
    <text x="865" y="188" fill="#a1a1aa" font-size="10" text-anchor="middle">• OWASP &amp; ASVS Tags</text>
    <text x="865" y="204" fill="#a1a1aa" font-size="10" text-anchor="middle">• baselineState &amp; Suppressions</text>
