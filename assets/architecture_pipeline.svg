<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="grad-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Filters for Glow / Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="720" y="48" fill="#f8fafc" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="0.5">Offline Testing Model — End-to-End Analysis Architecture</text>
  <text x="720" y="76" fill="#94a3b8" font-size="14" text-anchor="middle">Air-Gapped Deterministic Pipeline with 4-Axis Taxonomy, Parallel Synthesis, and Test-Confirmation Feedback</text>

  <!-- Formula Callout Banner -->
  <rect x="180" y="96" width="1080" height="52" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="128" fill="#38bdf8" font-size="14" font-weight="bold">PRIORITY ENGINE:</text>
  <text x="345" y="128" fill="#f1f5f9" font-size="14" font-family="monospace">Priority = Severity (1..5) × Confidence (0.4..1.0) × Reachability (0.3..1.0) × Exposure (0.2..1.0)</text>
  <text x="1060" y="128" fill="#a78bfa" font-size="12" font-weight="600">DEDUP BY ROOT CAUSE</text>

  <!-- ================= PHASE 1: Intake & Advisory ================= -->
  <g transform="translate(60, 175)" filter="url(#shadow)">
    <rect width="260" height="230" rx="12" fill="#0f172a" stroke="#1d4ed8" stroke-width="2"/>
    <rect width="260" height="42" rx="12" fill="url(#grad-blue)"/>
    <text x="130" y="26" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">PHASE 1: INTAKE &amp; ADVISORY</text>
    
    <text x="20" y="70" fill="#f8fafc" font-size="13" font-weight="600">• Project Ingestion &amp; AST Parser</text>
    <text x="35" y="90" fill="#94a3b8" font-size="11">Directory walk, file hashes, token bounds</text>
    
    <text x="20" y="115" fill="#f8fafc" font-size="13" font-weight="600">• SBOM Dependency Extraction</text>
    <text x="35" y="135" fill="#94a3b8" font-size="11">requirements.txt, pyproject.toml, package.json</text>
    
    <text x="20" y="160" fill="#f8fafc" font-size="13" font-weight="600">• Air-Gap Advisory Matcher</text>
    <text x="35" y="180" fill="#94a3b8" font-size="11">OSV snapshot (2026-10-01) + staleness warn</text>
    
    <rect x="15" y="196" width="230" height="22" rx="4" fill="#1e293b"/>
    <text x="130" y="211" fill="#38bdf8" font-size="10.5" font-family="monospace" text-anchor="middle">Advisories &amp; Project AST Ready</text>
  </g>

  <!-- Connection: Phase 1 -> Phase 2 -->
  <path d="M 320 290 L 370 290" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ================= PHASE 2: Static Grounding & Taint ================= -->
  <g transform="translate(370, 175)" filter="url(#shadow)">
    <rect width="270" height="230" rx="12" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <rect width="270" height="42" rx="12" fill="url(#grad-emerald)"/>
    <text x="135" y="26" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">PHASE 2: STATIC &amp; TAINT</text>
    
    <text x="20" y="70" fill="#f8fafc" font-size="13" font-weight="600">• Static Rule Engine (OT-001..025)</text>
    <text x="35" y="90" fill="#94a3b8" font-size="11">CWE/OWASP mapped base rules (no title hack)</text>
    
    <text x="20" y="115" fill="#f8fafc" font-size="13" font-weight="600">• Source-Sink Taint Engine</text>
    <text x="35" y="135" fill="#94a3b8" font-size="11">AST dataflow (request.args → exec/eval)</text>
    
    <text x="20" y="160" fill="#f8fafc" font-size="13" font-weight="600">• SARIF CodeFlow Generator</text>
    <text x="35" y="180" fill="#94a3b8" font-size="11">Step-by-step injection propagation paths</text>
    
    <rect x="15" y="196" width="240" height="22" rx="4" fill="#1e293b"/>
    <text x="135" y="211" fill="#34d399" font-size="10.5" font-family="monospace" text-anchor="middle">Static Findings &amp; CodeFlows</text>
  </g>

  <!-- Connection: Phase 2 split to 3A and 3B -->
  <!-- Upper fork to Phase 3A -->
  <path d="M 640 260 L 675 260 L 675 220 L 710 220" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- Lower fork to Phase 3B -->
  <path d="M 640 320 L 675 320 L 675 360 L 710 360" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- ================= PHASE 3A (Parallel): Structure & Access Control ================= -->
  <g transform="translate(710, 160)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.8"/>
    <rect width="320" height="30" rx="10" fill="url(#grad-blue)"/>
    <text x="160" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">PHASE 3A (PARALLEL): APP STRUCTURE &amp; RBAC</text>
    <text x="15" y="52" fill="#f8fafc" font-size="12" font-weight="600">• Framework Route &amp; Middleware Extractor</text>
    <text x="15" y="74" fill="#f8fafc" font-size="12" font-weight="600">• Multi-Type Access Control Checker:</text>
    <text x="25" y="93" fill="#94a3b8" font-size="10.5">OT-SEC-012 (Auth), OT-SEC-013 (IDOR), OT-SEC-014 (PrivEsc), OT-SEC-015 (CORS)</text>
  </g>

  <!-- ================= PHASE 3B (Parallel): Test Synthesis & Sandbox Execution ================= -->
  <g transform="translate(710, 305)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#0f172a" stroke="#9333ea" stroke-width="1.8"/>
    <rect width="320" height="30" rx="10" fill="url(#grad-purple)"/>
    <text x="160" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">PHASE 3B (PARALLEL): TEST RUNNER &amp; SANDBOX</text>
    <text x="15" y="52" fill="#f8fafc" font-size="12" font-weight="600">• Offline Test Harness Discovery (pytest/unittest)</text>
    <text x="15" y="74" fill="#f8fafc" font-size="12" font-weight="600">• Subprocess Execution with Timeouts &amp; Isolation</text>
    <text x="15" y="95" fill="#f8fafc" font-size="12" font-weight="600">• Captures Pass / Fail / Flaky Oracle Signals</text>
  </g>

  <!-- Connection: Phase 3A converges to Phase 4 -->
  <path d="M 1030 220 L 1065 220 L 1065 260 L 1100 260" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Connection: Phase 3B converges to Phase 4 (with Test Feedback Loop label) -->
  <path d="M 1030 365 L 1065 365 L 1065 320 L 1100 320" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- ================= PHASE 4: Scoring, Dedup & Test-Confirmation Feedback ================= -->
  <g transform="translate(1100, 160)" filter="url(#shadow)">
    <rect width="290" height="265" rx="12" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <rect width="290" height="42" rx="12" fill="url(#grad-amber)"/>
    <text x="145" y="26" fill="#ffffff" font-size="13.5" font-weight="bold" text-anchor="middle">PHASE 4: SCORING &amp; FEEDBACK</text>
    
    <text x="15" y="66" fill="#f8fafc" font-size="12" font-weight="600">1. Test-Confirmation Feedback Loop</text>
    <text x="25" y="84" fill="#34d399" font-size="10.5">Test Failure → elevates to 'test-confirmed'</text>
    <text x="25" y="98" fill="#94a3b8" font-size="10.5">Clean Pass → demotes certainty &amp; score</text>
    
    <text x="15" y="124" fill="#f8fafc" font-size="12" font-weight="600">2. Reachability &amp; Exposure Scoring</text>
    <text x="25" y="142" fill="#94a3b8" font-size="10.5">Dead code: 0.3x reachability discount</text>
    <text x="25" y="156" fill="#94a3b8" font-size="10.5">Public route: 1.0x exposure multiplier</text>
    
    <text x="15" y="182" fill="#f8fafc" font-size="12" font-weight="600">3. Root-Cause Deduplication</text>
    <text x="25" y="200" fill="#94a3b8" font-size="10.5">Cluster duplicate findings (file, rule, AST parent)</text>
    
    <rect x="15" y="218" width="260" height="34" rx="6" fill="#1e293b"/>
    <text x="145" y="234" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">Priority = S(1..5) × C(0.4..1) × R × E</text>
    <text x="145" y="246" fill="#94a3b8" font-size="9.5" text-anchor="middle">Deterministic Ranked Punch-List</text>
  </g>

  <!-- Big Feedback Arrow explicitly labeled: Phase 3B -> Phase 4 Feedback -->
  <text x="1065" y="300" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">TEST FEEDBACK</text>

  <!-- Connection: Phase 4 -> Phase 5 (Downward Arrow to Reports) -->
  <path d="M 1245 425 L 1245 480 L 720 480 L 720 520" fill="none" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="635" y="468" width="170" height="24" rx="6" fill="#1e293b" stroke="#e11d48"/>
  <text x="720" y="484" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">VERIFIED EVIDENCE STORE</text>

  <!-- ================= PHASE 5: Multi-Report Generation & Outputs ================= -->
  <g transform="translate(60, 530)" filter="url(#shadow)">
    <rect width="1330" height="185" rx="12" fill="#0f172a" stroke="#e11d48" stroke-width="2"/>
    <rect width="1330" height="38" rx="12" fill="url(#grad-rose)"/>
    <text x="665" y="24" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">PHASE 5: MULTI-REPORT GENERATION (ORDERED ARTIFACT SUITE)</text>

    <!-- Report 1 -->
    <g transform="translate(30, 52)">
      <rect width="290" height="115" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="24" fill="#38bdf8" font-size="13" font-weight="bold">Report 1: Executive Summary</text>
      <text x="15" y="42" fill="#94a3b8" font-size="11">offline_testing_model_report.md</text>
      <text x="15" y="65" fill="#e2e8f0" font-size="11">• Gate Pass / Fail Decision</text>
      <text x="15" y="83" fill="#e2e8f0" font-size="11">• Posture Score (0-100) &amp; Air-Gap Policy</text>
      <text x="15" y="101" fill="#e2e8f0" font-size="11">• Advisory Snapshot Age &amp; Staleness Warn</text>
    </g>

    <!-- Report 2 -->
    <g transform="translate(350, 52)">
      <rect width="290" height="115" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="24" fill="#34d399" font-size="13" font-weight="bold">Report 2: Engineering Punch-List</text>
      <text x="15" y="42" fill="#94a3b8" font-size="11">developer_remediation_plan.md</text>
      <text x="15" y="65" fill="#e2e8f0" font-size="11">• Ranked by Priority Formula</text>
      <text x="15" y="83" fill="#e2e8f0" font-size="11">• Root-cause deduplicated clusters</text>
      <text x="15" y="101" fill="#e2e8f0" font-size="11">• Concrete code fix snippets &amp; line diffs</text>
    </g>

    <!-- Report 3 -->
    <g transform="translate(670, 52)">
      <rect width="310" height="115" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="24" fill="#fbbf24" font-size="13" font-weight="bold">Report 3: Architecture &amp; SBOM Ledger</text>
      <text x="15" y="42" fill="#94a3b8" font-size="11">system_architecture_report.md</text>
      <text x="15" y="65" fill="#e2e8f0" font-size="11">• Endpoints, DB sinks, RBAC auth matrix</text>
      <text x="15" y="83" fill="#e2e8f0" font-size="11">• CycloneDX / SPDX offline component SBOM</text>
      <text x="15" y="101" fill="#e2e8f0" font-size="11">• Dependency CVE status &amp; reachability</text>
    </g>

    <!-- Report 4: SARIF & Attestation -->
    <g transform="translate(1010, 52)">
      <rect width="290" height="115" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="24" fill="#c084fc" font-size="13" font-weight="bold">Machine SARIF &amp; Attestation</text>
      <text x="15" y="42" fill="#94a3b8" font-size="11">results.sarif &amp; attestation.json</text>
      <text x="15" y="65" fill="#e2e8f0" font-size="11">• OASIS SARIF v2.1.0 with codeFlows</text>
      <text x="15" y="83" fill="#e2e8f0" font-size="11">• Cryptographic SHA-256 seal</text>
      <text x="15" y="101" fill="#e2e8f0" font-size="11">• CI/CD gate automation consumption</text>
    </g>
  </g>

  <!-- ================= 4-AXIS TAXONOMY DEFINITION BANNER ================= -->
  <g transform="translate(60, 735)" filter="url(#shadow)">
    <rect width="1330" height="150" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" fill="#38bdf8" font-size="15" font-weight="bold">THE 4 ORTHOGONAL TAXONOMY AXES (INDEPENDENT DATA FIELDS)</text>
    
    <!-- Axis 1 -->
    <g transform="translate(25, 45)">
      <rect width="295" height="90" rx="6" fill="#111827" stroke="#1f2937"/>
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="bold">Axis 1: Category</text>
      <text x="15" y="44" fill="#94a3b8" font-size="11">Standard CWE &amp; OWASP Top 10</text>
      <text x="15" y="62" fill="#64748b" font-size="10.5">e.g. CWE-89 (SQLi), CWE-798 (Secrets),</text>
      <text x="15" y="78" fill="#64748b" font-size="10.5">CWE-639 (IDOR), CWE-285 (PrivEsc)</text>
    </g>

    <!-- Axis 2 -->
    <g transform="translate(340, 45)">
      <rect width="295" height="90" rx="6" fill="#111827" stroke="#1f2937"/>
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="bold">Axis 2: Intrinsic Severity</text>
      <text x="15" y="44" fill="#94a3b8" font-size="11">Worst-case technical impact</text>
      <text x="15" y="62" fill="#64748b" font-size="10.5">• CRITICAL (5.0)  • HIGH (4.0)</text>
      <text x="15" y="78" fill="#64748b" font-size="10.5">• MEDIUM (3.0)    • LOW (2.0)  • INFO (1.0)</text>
    </g>

    <!-- Axis 3 -->
    <g transform="translate(655, 45)">
      <rect width="295" height="90" rx="6" fill="#111827" stroke="#1f2937"/>
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="bold">Axis 3: Engine Confidence</text>
      <text x="15" y="44" fill="#94a3b8" font-size="11">Single normalized scale</text>
      <text x="15" y="62" fill="#64748b" font-size="10.5">• CONFIRMED (1.0) - High pattern/test match</text>
      <text x="15" y="78" fill="#64748b" font-size="10.5">• LIKELY (0.7)  • POSSIBLE (0.4)</text>
    </g>

    <!-- Axis 4 -->
    <g transform="translate(970, 45)">
      <rect width="335" height="90" rx="6" fill="#111827" stroke="#1f2937"/>
      <text x="15" y="24" fill="#f8fafc" font-size="13" font-weight="bold">Axis 4: Evidence Level</text>
      <text x="15" y="44" fill="#94a3b8" font-size="11">Verification pedigree</text>
      <text x="15" y="62" fill="#64748b" font-size="10.5">• test-confirmed (dynamic failure executed)</text>
      <text x="15" y="78" fill="#64748b" font-size="10.5">• reachable | static-only | model-hypothesis</text>
    </g>
  </g>
</svg>
