<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Filters for Glow / Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="720" y="46" fill="#f8fafc" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="0.5">Offline Testing Model — End-to-End Analysis Architecture</text>
  <text x="720" y="72" fill="#94a3b8" font-size="14" text-anchor="middle">Air-Gapped Deterministic Pipeline: 4-Axis Taxonomy, Parallel Synthesis, and All-Source Convergence to Phase 4</text>

  <!-- Formula Callout Banner -->
  <rect x="120" y="92" width="1200" height="54" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="124" fill="#38bdf8" font-size="13" font-weight="bold">PRIORITY FORMULA:</text>
  <text x="285" y="124" fill="#f1f5f9" font-size="13" font-family="monospace">Priority = Severity Weight (10/7/4/2/0.5) × Confidence (0.4..1.0) × Reachability (1.0/0.7/0.2) × Exposure (1.5/1.0/0.6/0.2)</text>
  <text x="1170" y="124" fill="#a78bfa" font-size="12" font-weight="600">DEDUP BY ROOT CAUSE</text>

  <!-- ================= PHASE 1: Intake & Advisory ================= -->
  <g transform="translate(50, 165)" filter="url(#shadow)">
    <rect width="270" height="240" rx="12" fill="#0f172a" stroke="#1d4ed8" stroke-width="2"/>
    <rect width="270" height="42" rx="12" fill="url(#grad-blue)"/>
    <text x="135" y="26" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">PHASE 1: INTAKE &amp; ADVISORY</text>
    
    <text x="18" y="70" fill="#f8fafc" font-size="12.5" font-weight="600">• Project Ingestion &amp; Zip-Slip Guard</text>
    <text x="32" y="88" fill="#94a3b8" font-size="11">Directory walk, file hashes, token bounds</text>
    
    <text x="18" y="112" fill="#f8fafc" font-size="12.5" font-weight="600">• Entropy Secret &amp; Git-History Scan</text>
    <text x="32" y="130" fill="#94a3b8" font-size="11">Context allowlist + commit log credentials</text>
    
    <text x="18" y="154" fill="#f8fafc" font-size="12.5" font-weight="600">• CycloneDX 1.5 SBOM &amp; OSV Matcher</text>
    <text x="32" y="172" fill="#94a3b8" font-size="11">Offline snapshot (2026-10-01) + staleness guard</text>

    <rect x="15" y="196" width="240" height="24" rx="4" fill="#1e293b"/>
    <text x="135" y="212" fill="#38bdf8" font-size="10.5" font-family="monospace" text-anchor="middle">AST, SBOM &amp; Advisory Inventory Ready</text>
  </g>

  <!-- Connection: Phase 1 -> Phase 2 -->
  <path d="M 320 285 L 370 285" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ================= PHASE 2: Static Grounding & Taint ================= -->
  <g transform="translate(370, 165)" filter="url(#shadow)">
    <rect width="280" height="240" rx="12" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <rect width="280" height="42" rx="12" fill="url(#grad-emerald)"/>
    <text x="140" y="26" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">PHASE 2: STATIC &amp; TAINT</text>
    
    <text x="18" y="70" fill="#f8fafc" font-size="12.5" font-weight="600">• Static Rule Engine (OT-001..025)</text>
    <text x="32" y="88" fill="#94a3b8" font-size="11">CWE / OWASP mapped base security rules</text>
    
    <text x="18" y="112" fill="#f8fafc" font-size="12.5" font-weight="600">• Source-to-Sink Taint Engine</text>
    <text x="32" y="130" fill="#94a3b8" font-size="11">Dataflow tracking (request.args → exec/eval)</text>
    
    <text x="18" y="154" fill="#f8fafc" font-size="12.5" font-weight="600">• Cross-File Call Graph &amp; VEX</text>
    <text x="32" y="172" fill="#94a3b8" font-size="11">Reachability assessment (affected vs unreached)</text>
    
    <rect x="15" y="196" width="250" height="24" rx="4" fill="#1e293b"/>
    <text x="140" y="212" fill="#34d399" font-size="10.5" font-family="monospace" text-anchor="middle">Static, Taint &amp; VEX Findings Extracted</text>
  </g>

  <!-- Connection: Phase 2 split into parallel branches 3A (top) and 3B (bottom) -->
  <path d="M 650 250 L 685 250 L 685 215 L 720 215" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 650 320 L 685 320 L 685 355 L 720 355" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)"/>

  <!-- ================= PHASE 3A (Parallel): Structure & Access Control ================= -->
  <g transform="translate(720, 155)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.8"/>
    <rect width="320" height="30" rx="10" fill="url(#grad-blue)"/>
    <text x="160" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">PHASE 3A (PARALLEL): APP STRUCTURE &amp; RBAC</text>
    <text x="15" y="52" fill="#f8fafc" font-size="12" font-weight="600">• Route &amp; Middleware Extractor (OpenAPI 3.1)</text>
    <text x="15" y="74" fill="#f8fafc" font-size="12" font-weight="600">• Function vs. Object Auth Rules:</text>
    <text x="25" y="93" fill="#94a3b8" font-size="10.5">OT-SEC-012 (Unauth), OT-SEC-013 (IDOR), OT-SEC-014 (PrivEsc), OT-SEC-015 (CORS)</text>
  </g>

  <!-- ================= PHASE 3B (Parallel): Test Synthesis & Sandbox Execution ================= -->
  <g transform="translate(720, 295)" filter="url(#shadow)">
    <rect width="320" height="120" rx="10" fill="#0f172a" stroke="#9333ea" stroke-width="1.8"/>
    <rect width="320" height="30" rx="10" fill="url(#grad-purple)"/>
    <text x="160" y="20" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">PHASE 3B (PARALLEL): TEST RUNNER &amp; SANDBOX</text>
    <text x="15" y="52" fill="#f8fafc" font-size="12" font-weight="600">• Constrained Branch Test Synthesis (CFG Predicates)</text>
    <text x="15" y="74" fill="#f8fafc" font-size="12" font-weight="600">• Isolated Sandbox Execution (Job Objects / Socket Guards)</text>
    <text x="15" y="95" fill="#f8fafc" font-size="12" font-weight="600">• Captures Pass / Fail Execution Oracles</text>
  </g>

  <!-- Convergence: Phase 3A findings converge into Phase 4 -->
  <path d="M 1040 215 L 1070 215 L 1070 255 L 1100 255" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Convergence: Phase 3B test results converge into Phase 4 with feedback -->
  <path d="M 1040 355 L 1070 355 L 1070 315 L 1100 315" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1070" y="290" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">FEEDBACK</text>

  <!-- Direct bypass prevention: Phase 2 static/taint/secret findings also converge directly into Phase 4 -->
  <path d="M 640 375 L 685 375 L 685 400 L 1070 400 L 1070 375 L 1100 375" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="880" y="415" fill="#34d399" font-size="10" text-anchor="middle">All Findings (Secrets, Advisories, Taint, Static) Strictly Converge on Phase 4</text>

  <!-- ================= PHASE 4: Scoring, Dedup & Feedback ================= -->
  <g transform="translate(1100, 155)" filter="url(#shadow)">
    <rect width="300" height="270" rx="12" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <rect width="300" height="42" rx="12" fill="url(#grad-amber)"/>
    <text x="150" y="26" fill="#ffffff" font-size="13.5" font-weight="bold" text-anchor="middle">PHASE 4: SCORING &amp; FEEDBACK</text>
    
    <text x="15" y="66" fill="#f8fafc" font-size="12" font-weight="600">1. Asymmetric Test Feedback</text>
    <text x="25" y="84" fill="#34d399" font-size="10.5">• Test Failure → elevates to 'test-confirmed'</text>
    <text x="25" y="98" fill="#94a3b8" font-size="10.5">• Non-confirmation does NOT demote static rules</text>
    <text x="25" y="112" fill="#fbbf24" font-size="10.5">• Flaky test → tags 'flaky-test'</text>
    
    <text x="15" y="136" fill="#f8fafc" font-size="12" font-weight="600">2. Calibrated Priority Calculation</text>
    <text x="25" y="154" fill="#94a3b8" font-size="10.5">Priority = Sev(10..0.5) × Conf × Reach × Expo</text>
    <text x="25" y="168" fill="#94a3b8" font-size="10.5">Unreachable: 0.2x discount | Public: 1.5x</text>
    
    <text x="15" y="194" fill="#f8fafc" font-size="12" font-weight="600">3. Root-Cause Deduplication</text>
    <text x="25" y="212" fill="#94a3b8" font-size="10.5">Cluster duplicate findings (file::rule::parent)</text>
    
    <rect x="15" y="226" width="270" height="32" rx="6" fill="#1e293b"/>
    <text x="150" y="246" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Unified Evidence Store Ingestion</text>
  </g>

  <!-- Connection: Phase 4 -> Phase 5 -->
  <path d="M 1250 425 L 1250 475 L 720 475 L 720 520" fill="none" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="635" y="463" width="170" height="24" rx="6" fill="#1e293b" stroke="#e11d48"/>
  <text x="720" y="479" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">VERIFIED EVIDENCE STORE</text>

  <!-- ================= PHASE 5: Multi-Report Generation ================= -->
  <g transform="translate(50, 525)" filter="url(#shadow)">
    <rect width="1340" height="205" rx="12" fill="#0f172a" stroke="#e11d48" stroke-width="2"/>
    <rect width="1340" height="38" rx="12" fill="url(#grad-rose)"/>
    <text x="670" y="24" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">PHASE 5: MULTI-REPORT GENERATION (STRICT 1, 2, 3, 4 ARTIFACT ORDER)</text>

    <!-- Report 1 -->
    <g transform="translate(25, 48)">
      <rect width="300" height="142" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="22" fill="#38bdf8" font-size="13" font-weight="bold">1. Executive Summary &amp; Gate</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">offline_testing_model_report.md</text>
      <text x="15" y="60" fill="#e2e8f0" font-size="11">• CI/CD Gate: Pass vs. Fail Decision</text>
      <text x="15" y="78" fill="#f43f5e" font-size="10.5">  FAIL: Confirmed Crit/High, Policy, or Score &gt;= 7.0</text>
      <text x="15" y="96" fill="#34d399" font-size="10.5">  PASS: Clean scan, no air-gap breach</text>
      <text x="15" y="116" fill="#e2e8f0" font-size="11">• Advisory Snapshot Age &amp; Staleness Audit</text>
    </g>

    <!-- Report 2 -->
    <g transform="translate(350, 48)">
      <rect width="305" height="142" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="22" fill="#34d399" font-size="13" font-weight="bold">2. Remediation Punch-List</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">developer_remediation_plan.md</text>
      <text x="15" y="60" fill="#e2e8f0" font-size="11">• Sorted descending by Priority Formula</text>
      <text x="15" y="78" fill="#e2e8f0" font-size="11">• Clustered by Root Cause (file::rule::parent)</text>
      <text x="15" y="96" fill="#e2e8f0" font-size="11">• Concrete code fix snippets &amp; line diffs</text>
      <text x="15" y="116" fill="#e2e8f0" font-size="11">• Deterministic IDs: FIND-RULE-HASH</text>
    </g>

    <!-- Report 3 -->
    <g transform="translate(680, 48)">
      <rect width="315" height="142" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="22" fill="#fbbf24" font-size="13" font-weight="bold">3. Architecture &amp; SBOM Ledger</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">system_architecture_report.md</text>
      <text x="15" y="60" fill="#e2e8f0" font-size="11">• Reconstructed OpenAPI 3.1 REST specs</text>
      <text x="15" y="78" fill="#e2e8f0" font-size="11">• Role-Based Access Control (RBAC) matrix</text>
      <text x="15" y="96" fill="#e2e8f0" font-size="11">• CycloneDX 1.5 offline component SBOM</text>
      <text x="15" y="116" fill="#e2e8f0" font-size="11">• VEX Reachability: affected vs. not_affected</text>
    </g>

    <!-- Report 4: SARIF & Attestation -->
    <g transform="translate(1020, 48)">
      <rect width="295" height="142" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="15" y="22" fill="#c084fc" font-size="13" font-weight="bold">4. Machine SARIF &amp; Attestation</text>
      <text x="15" y="38" fill="#94a3b8" font-size="11">results.sarif &amp; attestation.json</text>
      <text x="15" y="60" fill="#e2e8f0" font-size="11">• OASIS SARIF v2.1.0 with codeFlows</text>
      <text x="15" y="78" fill="#e2e8f0" font-size="11">• CWE / OWASP tags &amp; baselineState</text>
      <text x="15" y="96" fill="#e2e8f0" font-size="11">• Cryptographic SHA-256 / HMAC seal</text>
      <text x="15" y="116" fill="#e2e8f0" font-size="11">• Ready for CI/CD dashboard ingestion</text>
    </g>
  </g>

  <!-- ================= 4-AXIS TAXONOMY DEFINITION BANNER ================= -->
  <g transform="translate(50, 745)" filter="url(#shadow)">
    <rect width="1340" height="165" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="28" fill="#38bdf8" font-size="14.5" font-weight="bold">THE 4 ORTHOGONAL TAXONOMY AXES (INDEPENDENT DATA FIELDS)</text>
    
    <!-- Axis 1 -->
    <g transform="translate(25, 42)">
      <rect width="295" height="108" rx="6" fill="#111827" stroke="#1f2937"/>
      <text x="15" y="22" fill="#f8fafc" font-size="12.5" font-weight="bold">Axis 1: Category</text>
      <text x="15" y="40" fill="#94a3b8" font-size="11">Standard CWE &amp; OWASP Top 10</text>
      <text x="15" y="58" fill="#64748b" font-size="10.5">• CWE-89 (SQLi)  • CWE-798 (Secrets)</text>
      <text x="15" y="74" fill="#64748b" font-size="10.5">• CWE-639 (Object Auth / IDOR)</text>
      <text x="15" y="90" fill="#64748b" font-size="10.5">• CWE-285 (Function Auth / PrivEsc)</text>
    </g>

    <!-- Axis 2 -->
    <g transform="translate(340, 42)">
      <rect width="295" height="108" rx="6" fill="#111827" stroke="#1f2937"/>
      <text x="15" y="22" fill="#f8fafc" font-size="12.5" font-weight="bold">Axis 2: Intrinsic Severity</text>
      <text x="15" y="40" fill="#94a3b8" font-size="11">Worst-case technical impact weight</text>
      <text x="15" y="58" fill="#64748b" font-size="10.5">• CRITICAL (10.0)  • HIGH (7.0)</text>
      <text x="15" y="74" fill="#64748b" font-size="10.5">• MEDIUM (4.0)    • LOW (2.0)</text>
      <text x="15" y="90" fill="#64748b" font-size="10.5">• INFORMATIONAL (0.5)</text>
    </g>

    <!-- Axis 3 -->
    <g transform="translate(655, 42)">
      <rect width="295" height="108" rx="6" fill="#111827" stroke="#1f2937"/>
      <text x="15" y="22" fill="#f8fafc" font-size="12.5" font-weight="bold">Axis 3: Engine Confidence</text>
      <text x="15" y="40" fill="#94a3b8" font-size="11">Single normalized certainty scale (0..1)</text>
      <text x="15" y="58" fill="#64748b" font-size="10.5">• CONFIRMED (1.0) - High pattern/test match</text>
      <text x="15" y="74" fill="#64748b" font-size="10.5">• LIKELY (0.8)     • MEDIUM (0.6)</text>
      <text x="15" y="90" fill="#64748b" font-size="10.5">• POSSIBLE (0.4)</text>
    </g>

    <!-- Axis 4 -->
    <g transform="translate(970, 42)">
      <rect width="345" height="108" rx="6" fill="#111827" stroke="#1f2937"/>
      <text x="15" y="22" fill="#f8fafc" font-size="12.5" font-weight="bold">Axis 4: Evidence Level</text>
      <text x="15" y="40" fill="#94a3b8" font-size="11">Verification pedigree hierarchy</text>
      <text x="15" y="58" fill="#64748b" font-size="10.5">• test-confirmed (dynamic test reproduction)</text>
      <text x="15" y="74" fill="#64748b" font-size="10.5">• reachable (connected via call graph)</text>
      <text x="15" y="90" fill="#64748b" font-size="10.5">• static-only | model-hypothesis (unverified)</text>
    </g>
  </g>
</svg>
