    <line x1="500" y1="75" x2="380" y2="105" stroke="#f43f5e" stroke-width="2"/>
    <line x1="500" y1="75" x2="620" y2="105" stroke="#f43f5e" stroke-width="2"/>
    <line x1="500" y1="75" x2="865" y2="105" stroke="#f43f5e" stroke-width="2"/>

