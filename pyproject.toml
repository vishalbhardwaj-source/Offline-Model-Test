[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "offtest"
version = "0.1.0"
description = "Offline App and Website Testing Model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
offtest = "offtest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["offtest*"]
exclude = ["sample_repos*", "reproduced_reports*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
